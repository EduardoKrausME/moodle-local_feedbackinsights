name: Auto-release via commit message

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild the Moodle-installable ZIP
        required: true
        type: string

permissions:
  contents: write

jobs:
  auto-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'V ') || startsWith(github.event.head_commit.message, 'Repackage ')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version or existing tag
        id: ver
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=""
          REPACKAGE=0
          if [ -n "$REQUESTED_TAG" ]; then
            VERSION="$REQUESTED_TAG"
            REPACKAGE=1
          elif printf '%s' "$RELEASE_MESSAGE" | grep -Eq '^Repackage [0-9]+[.][0-9]+[.][0-9]+$'; then
            VERSION="$(printf '%s' "$RELEASE_MESSAGE" | cut -d ' ' -f2)"
            REPACKAGE=1
          elif printf '%s' "$RELEASE_MESSAGE" | grep -Eq '^V [0-9]+[.][0-9]+[.][0-9]+$'; then
            VERSION="$(printf '%s' "$RELEASE_MESSAGE" | cut -d ' ' -f2)"
          else
            echo "No release version in commit message."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "Invalid version or tag."
            exit 1
          fi
          if [ "$REPACKAGE" = 1 ]; then
            git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null
            git checkout --detach "refs/tags/$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repackage=$REPACKAGE" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag for new version
        if: steps.ver.outputs.repackage != '1'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Build Moodle-installable ZIP and verify root
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ARCHIVE="local_feedbackinsights_$VERSION.zip"
          git archive --format=zip --prefix=feedbackinsights/ --output="$ARCHIVE" HEAD
          test -s "$ARCHIVE"
          unzip -Z1 "$ARCHIVE" | awk '
            index($0, "feedbackinsights/") != 1 { invalid = 1 }
            $0 == "feedbackinsights/version.php" { found = 1 }
            END { exit invalid || !found }
          '
          echo "Validated $ARCHIVE"

      - name: Create or update GitHub Release with installable ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: local_feedbackinsights_${{ steps.ver.outputs.version }}.zip
          fail_on_unmatched_files: true
          body: |
            Installable Moodle ZIP: local_feedbackinsights_${{ steps.ver.outputs.version }}.zip
            Archive root: feedbackinsights/
        env:
          GITHUB_TOKEN: ${{ github.token }}
