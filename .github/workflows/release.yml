name: Auto-release via commit message

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild the installable ZIP
        required: true
        type: string

permissions:
  contents: write

jobs:
  auto-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'V ') || startsWith(github.event.head_commit.message, 'Repackage ')

    runs-on:
      ubuntu-latest

    outputs:
      tag: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version of the commit message.
        id: ver
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            VERSION="$REQUESTED_TAG"
            REPACKAGE=1
          elif printf '%s' "$RELEASE_MESSAGE" | grep -Eq '^Repackage [0-9]+\\.[0-9]+\\.[0-9]+
            VERSION=$(printf '%s' "$RELEASE_MESSAGE" | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            REPACKAGE=0
          else
            echo "No valid version in the commit message."
          fi
          if [ -n "${VERSION:-}" ]; then
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+
        if: steps.ver.outputs.version == ''
        run: |
          echo "Ignoring: commit is not a release."

      - name: Create annotated tag
        if: steps.ver.outputs.version != '' && steps.ver.outputs.repackage != '1'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # usa sem prefixo (ex.: 1.2.3)
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Build and validate Moodle installable ZIP
        if: steps.ver.outputs.version != ''
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ARCHIVE="local_feedbackinsights_${VERSION}.zip"
          git archive --format=zip --prefix=feedbackinsights/ --output="$ARCHIVE" HEAD
          test -s "$ARCHIVE"
          unzip -Z1 "$ARCHIVE" | awk '
            index($0, "feedbackinsights/") != 1 { bad = 1 }
            $0 == "feedbackinsights/version.php" { found = 1 }
            END { exit bad || !found }
          '
          echo "Validated installer archive $ARCHIVE"

      - name: Create a Release on GitHub
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: local_feedbackinsights_${{ steps.ver.outputs.version }}.zip
          fail_on_unmatched_files: true
          body: |
            Installable Moodle ZIP: local_feedbackinsights_${{ steps.ver.outputs.version }}.zip
            The archive contains the required feedbackinsights/ root folder.
        env:
          GITHUB_TOKEN: ${{ github.token }}
; then
            VERSION="${RELEASE_MESSAGE#Repackage }"
            REPACKAGE=1
          elif printf '%s' "$RELEASE_MESSAGE" | grep -Eq '^V [0-9]+\\.[0-9]+\\.[0-9]+
            VERSION=$(printf '%s' "$RELEASE_MESSAGE" | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No valid version in the commit message."
          fi

      - name: Close if there is no version.
        if: steps.ver.outputs.version == ''
        run: |
          echo "Ignoring: commit is not a release."

      - name: Create annotated tag
        if: steps.ver.outputs.version != ''
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # usa sem prefixo (ex.: 1.2.3)
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create a Release on GitHub
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            Release ${{ steps.ver.outputs.version }} automatically generated by the commit:
            ${{ github.event.head_commit.id }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
; then
            VERSION=$(printf '%s' "$RELEASE_MESSAGE" | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No valid version in the commit message."
          fi

      - name: Close if there is no version.
        if: steps.ver.outputs.version == ''
        run: |
          echo "Ignoring: commit is not a release."

      - name: Create annotated tag
        if: steps.ver.outputs.version != ''
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # usa sem prefixo (ex.: 1.2.3)
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create a Release on GitHub
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            Release ${{ steps.ver.outputs.version }} automatically generated by the commit:
            ${{ github.event.head_commit.id }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
; then
              echo "Invalid version/tag: $VERSION"
              exit 1
            fi
            if [ "${REPACKAGE:-0}" -eq 1 ]; then
              git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null || exit 1
              git checkout --detach "refs/tags/$VERSION"
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "repackage=${REPACKAGE:-0}" >> "$GITHUB_OUTPUT"
          fi

      - name: Close if there is no version.
        if: steps.ver.outputs.version == ''
        run: |
          echo "Ignoring: commit is not a release."

      - name: Create annotated tag
        if: steps.ver.outputs.version != ''
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # usa sem prefixo (ex.: 1.2.3)
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create a Release on GitHub
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            Release ${{ steps.ver.outputs.version }} automatically generated by the commit:
            ${{ github.event.head_commit.id }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
; then
            VERSION="${RELEASE_MESSAGE#Repackage }"
            REPACKAGE=1
          elif printf '%s' "$RELEASE_MESSAGE" | grep -Eq '^V [0-9]+\\.[0-9]+\\.[0-9]+
            VERSION=$(printf '%s' "$RELEASE_MESSAGE" | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No valid version in the commit message."
          fi

      - name: Close if there is no version.
        if: steps.ver.outputs.version == ''
        run: |
          echo "Ignoring: commit is not a release."

      - name: Create annotated tag
        if: steps.ver.outputs.version != ''
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # usa sem prefixo (ex.: 1.2.3)
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create a Release on GitHub
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            Release ${{ steps.ver.outputs.version }} automatically generated by the commit:
            ${{ github.event.head_commit.id }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
; then
            VERSION=$(printf '%s' "$RELEASE_MESSAGE" | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No valid version in the commit message."
          fi

      - name: Close if there is no version.
        if: steps.ver.outputs.version == ''
        run: |
          echo "Ignoring: commit is not a release."

      - name: Create annotated tag
        if: steps.ver.outputs.version != ''
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # usa sem prefixo (ex.: 1.2.3)
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create a Release on GitHub
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            Release ${{ steps.ver.outputs.version }} automatically generated by the commit:
            ${{ github.event.head_commit.id }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
